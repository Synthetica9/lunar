[package]
name = "lunar"
version = "0.4.0"
edition = "2021"
build = "build/main.rs"
default-run = "lunar"
authors = ["Patrick Hilhorst"]

[workspace]
resolver = "3"
members = ["trainer"]

[features]
default = ["asm", "readline", "intrinsics", "quickcheck"]
# Enables custom assembly. Can be disabled on platforms that support it
# to test "generic" code. All ASM _should_ be feature-gated.
asm = []
readline = ["rustyline"]
# Enable core_intrinsics and some implementations that that enables.
intrinsics = []
# Allow tuning via UCI
tunable = []
wasm = [
  "wasm-bindgen",
  "console_error_panic_hook",
  "wasm-bindgen-spawn",
  # "wasm_thread",
]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
opt-level = 3
panic = "abort"
codegen-units = 1
debug = true

# Make the build script run faster.
[profile.dev]
opt-level = 3

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["mman"], default-features = false }

[dependencies]
mutants = "0.0.3" # Just for the decorator
crossbeam-channel = "0.5"
smallvec = { version = "1.15", features = ["union"] }
static_assertions = "1.1"
rustyline = { version = "15.0", optional = true, default-features = false }
not_empty = "0.1"
lru = { version = "0.14", default-features = false }
linear-map = "1.2"
quickcheck = { version = "1.0.3", default-features = false, optional=true }
fixed = { version = "1.28.0", default-features = false }
rand = { version = "0.8", features = [
  "small_rng",
  "alloc",
], default-features = false }

# Wasm specific stuff
wasm-bindgen = { version = "=0.2.129", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
# wasm_thread = { version = "0.3", optional = true }
wasm-bindgen-spawn = { version = "0.0.7", optional = true }

[build-dependencies]
rand = { version = "0.8", features = ["small_rng"], default-features = false }
serde = { version = "1.0" }
serde_yaml = "0.9"

[dev-dependencies]
csv = "1.3"
# criterion = { version = "0.4", features = ["html_reports"] }
rand = { version = "0.8", features = [
  "small_rng",
  "alloc",
], default-features = false }
serde_yaml = "0.9"

hashbrown = "=0.17.1"
cfg-if = "=1.0.4"
rustc-demangle = "*"
object = "=0.39.1"
wasip1 = "*"
wasip2 = "*"
wasip3 = "=0.9.0+wasi-0.3.0"
dlmalloc = "*"
libc = "=0.2.191"
addr2line = "*"
hermit-abi = "*"
moto-rt = "=0.17.4"
r-efi = "=5.3.0"
r-efi-alloc = "*"
vex-sdk = "=0.27.1"
fortanix-sgx-abi = "=0.6.1"
rustc-literal-escaper = "*"
unwinding = "*"
memchr = "=2.8.3"
getopts = "*"

[[bench]]
name = "perft_bench"
harness = false

[lints.clippy]
semicolon_if_nothing_returned = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
items_after_statements = "warn"
match_same_arms = "warn"
uninlined_format_args = "warn"
match_wildcard_for_single_variants = "warn"
manual_let_else = "warn"
trivially_copy_pass_by_ref = "warn"
redundant_closure_for_method_calls = "warn"
return_self_not_must_use = "warn"
